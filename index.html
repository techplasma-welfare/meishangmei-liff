<script>

/* =====================================================
   LIFF 基本設定
===================================================== */

const LIFF_ID =
  "2011388395-xENMZYMD";

let liffSdkPromise = null;

function loadLiffSdk_(){

  if(window.liff){
    return Promise.resolve();
  }

  if(liffSdkPromise){
    return liffSdkPromise;
  }

  liffSdkPromise =
    new Promise(function(resolve,reject){

      const script =
        document.createElement("script");

      script.src =
        "https://static.line-scdn.net/liff/edge/2/sdk.js";

      script.async = true;

      script.onload =
        function(){

          if(window.liff){
            resolve();
          }else{
            reject(
              new Error("LIFF SDK 載入完成但無法使用")
            );
          }
        };

      script.onerror =
        function(){
          reject(
            new Error("LIFF SDK 載入失敗")
          );
        };

      document.head.appendChild(script);
    });

  return liffSdkPromise;
}



/* =====================================================
   元件
===================================================== */

const statusEl =
  document.getElementById("status");

const verifyButton =
  document.getElementById("verifyButton");

const idTokenInput =
  document.getElementById("idToken");

const verifyForm =
  document.getElementById("verifyForm");

const employeeIdInput =
  document.getElementById("employeeId");

const employeeNameInput =
  document.getElementById("employeeName");

const uiLanguageInput =
  document.getElementById("uiLanguage");

const languagePanel =
  document.getElementById("languagePanel");

const verifyTitle =
  document.getElementById("verifyTitle");

const verifySubtitle =
  document.getElementById("verifySubtitle");

const employeeIdLabel =
  document.getElementById("employeeIdLabel");

const employeeNameLabel =
  document.getElementById("employeeNameLabel");

const verifyNotice =
  document.getElementById("verifyNotice");

let currentLanguage = "";
let lineReady = false;
let lineProfileName = "";


/* =====================================================
   員工綁定頁多語系
===================================================== */

const VERIFY_I18N = {
  ZH: {
    title: "員工身分驗證",
    subtitle: "首次使用請完成員工資料驗證<br>驗證成功後即可使用員工福利服務",
    employeeId: "員工編號",
    employeeIdPlaceholder: "例如：A01001",
    employeeName: "姓名",
    employeeNamePlaceholder: "例如：美上鎂",
    connecting: "正在連線 LINE...",
    loggingIn: "正在登入 LINE...",
    lineReady: "✓ LINE 身分確認完成",
    confirm: "確認驗證",
    unavailable: "目前無法驗證",
    checking: "驗證中...",
    checkingEmployee: "正在核對員工資料...",
    incomplete: "請確認員工編號、姓名及 LINE 身分均已完成。",
    liffFailed: "✕ LINE 身分確認失敗：",
    notice: "🔒 本頁面僅用於美上鎂員工身分確認及 LINE 帳號綁定。LINE 身分會由 LINE 登入憑證進行驗證，員工資料將與公司員工名冊核對。"
  },
  ID: {
    title: "Verifikasi Identitas Karyawan",
    subtitle: "Silakan verifikasi data karyawan saat pertama kali menggunakan layanan.<br>Setelah berhasil, Anda dapat menggunakan layanan kesejahteraan karyawan.",
    employeeId: "Nomor Karyawan",
    employeeIdPlaceholder: "Contoh: A01001",
    employeeName: "Nama",
    employeeNamePlaceholder: "Masukkan nama sesuai data perusahaan",
    connecting: "Menghubungkan ke LINE...",
    loggingIn: "Masuk ke LINE...",
    lineReady: "✓ Identitas LINE berhasil dikonfirmasi",
    confirm: "Konfirmasi Verifikasi",
    unavailable: "Verifikasi tidak tersedia",
    checking: "Memverifikasi...",
    checkingEmployee: "Sedang mencocokkan data karyawan...",
    incomplete: "Pastikan nomor karyawan, nama, dan verifikasi LINE sudah lengkap.",
    liffFailed: "✕ Verifikasi LINE gagal: ",
    notice: "🔒 Halaman ini hanya digunakan untuk verifikasi identitas karyawan Meishangmei dan pengikatan akun LINE. Identitas LINE akan diverifikasi melalui kredensial login LINE dan data karyawan akan dicocokkan dengan daftar karyawan perusahaan."
  },
  TH: {
    title: "ยืนยันตัวตนพนักงาน",
    subtitle: "กรุณายืนยันข้อมูลพนักงานเมื่อใช้งานครั้งแรก<br>เมื่อยืนยันสำเร็จแล้ว จะสามารถใช้บริการสวัสดิการพนักงานได้",
    employeeId: "รหัสพนักงาน",
    employeeIdPlaceholder: "ตัวอย่าง: A01001",
    employeeName: "ชื่อ",
    employeeNamePlaceholder: "กรอกชื่อตามข้อมูลบริษัท",
    connecting: "กำลังเชื่อมต่อ LINE...",
    loggingIn: "กำลังเข้าสู่ระบบ LINE...",
    lineReady: "✓ ยืนยันตัวตน LINE สำเร็จ",
    confirm: "ยืนยันข้อมูล",
    unavailable: "ไม่สามารถยืนยันได้ในขณะนี้",
    checking: "กำลังตรวจสอบ...",
    checkingEmployee: "กำลังตรวจสอบข้อมูลพนักงาน...",
    incomplete: "กรุณาตรวจสอบรหัสพนักงาน ชื่อ และการยืนยัน LINE ให้ครบถ้วน",
    liffFailed: "✕ การยืนยัน LINE ล้มเหลว: ",
    notice: "🔒 หน้านี้ใช้สำหรับยืนยันตัวตนพนักงาน Meishangmei และเชื่อมบัญชี LINE เท่านั้น ระบบจะตรวจสอบตัวตน LINE ผ่านข้อมูลรับรองการเข้าสู่ระบบ LINE และตรวจสอบข้อมูลกับรายชื่อพนักงานของบริษัท"
  }
};

function getVerifyText(key) {
  const lang = currentLanguage || "ZH";
  return (
    VERIFY_I18N[lang] &&
    VERIFY_I18N[lang][key]
  ) || VERIFY_I18N.ZH[key] || key;
}

function applyVerifyLanguage(lang) {

  currentLanguage = ["ZH","ID","TH"].includes(lang)
    ? lang
    : "ZH";

  uiLanguageInput.value = currentLanguage;

  const t = VERIFY_I18N[currentLanguage];

  document.documentElement.lang =
    currentLanguage === "ID"
      ? "id"
      : currentLanguage === "TH"
        ? "th"
        : "zh-Hant";

  verifyTitle.textContent = t.title;
  verifySubtitle.innerHTML = t.subtitle;
  employeeIdLabel.textContent = t.employeeId;
  employeeIdInput.placeholder = t.employeeIdPlaceholder;
  employeeNameLabel.textContent = t.employeeName;
  employeeNameInput.placeholder = t.employeeNamePlaceholder;
  verifyNotice.textContent = t.notice;

  languagePanel.style.display = "none";
  verifyForm.style.display = "block";
  statusEl.style.display = "block";

  if (lineReady) {
    setStatus(
      t.lineReady +
      (lineProfileName ? "｜" + lineProfileName : ""),
      "success"
    );
    verifyButton.disabled = false;
    verifyButton.textContent = t.confirm;
  } else {
    setStatus(t.connecting, "");
    verifyButton.disabled = true;
    verifyButton.textContent = t.connecting;
  }
}

document.querySelectorAll(".language-button").forEach(function(button) {
  button.addEventListener("click", async function() {

    applyVerifyLanguage(
      this.getAttribute("data-lang")
    );

    if(!lineReady){

      try{
        await loadLiffSdk_();
        await initializeLiff();

      }catch(error){

        setStatus(
          getVerifyText("liffFailed") +
          (
            error && error.message
              ? error.message
              : ""
          ),
          "error"
        );

        verifyButton.disabled = true;
        verifyButton.textContent =
          getVerifyText("unavailable");
      }
    }
  });
});


/* =====================================================
   顯示狀態
===================================================== */

function setStatus(message, type) {

  statusEl.textContent = message;

  statusEl.className =
    "status" +
    (type ? " " + type : "");

}


/* =====================================================
   員工編號自動轉大寫
===================================================== */

employeeIdInput.addEventListener(
  "input",
  function () {

    this.value =
      this.value.toUpperCase();

  }
);


/* =====================================================
   LIFF 初始化
===================================================== */

async function initializeLiff() {

  try {

    if (typeof liff === "undefined") {
      throw new Error("LIFF SDK 尚未載入");
    }

    if(currentLanguage){ setStatus(getVerifyText("connecting"), ""); }

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      if(currentLanguage){ setStatus(getVerifyText("loggingIn"), ""); }
      liff.login();
      return;
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error("無法取得 LINE 登入憑證");
    }

    // 判斷是否為中秋座位表模式
    const params = new URLSearchParams(window.location.search);
    const page = params.get("page") || "";

    // ================================================
    // 5A. 員工限定活動連結模式
    // ================================================
    if (page === "activityLink") {

      languagePanel.style.display = "none";
      statusEl.style.display = "block";

      const activityCode =
        params.get("code") || "";

      if (!activityCode) {
        throw new Error(
          "缺少活動代碼"
        );
      }

      setStatus(
        "正在驗證員工身分並開啟活動連結...",
        ""
      );

      verifyForm.style.display =
        "none";

      const protectedForm =
        document.createElement("form");

      protectedForm.method =
        "POST";

      protectedForm.action =
        "https://script.google.com/macros/s/AKfycbwUY-3Cto9dvnFJsTEni5f2MC5ofsQ-xV3593-fgSfoux55AGkspFdnAmW7oef_HS7PEA/exec";

      const protectedAction =
        document.createElement("input");

      protectedAction.type =
        "hidden";

      protectedAction.name =
        "action";

      protectedAction.value =
        "getProtectedActivityLink";

      const protectedToken =
        document.createElement("input");

      protectedToken.type =
        "hidden";

      protectedToken.name =
        "idToken";

      protectedToken.value =
        idToken;

      const protectedCode =
        document.createElement("input");

      protectedCode.type =
        "hidden";

      protectedCode.name =
        "activityCode";

      protectedCode.value =
        activityCode;

      protectedForm.appendChild(
        protectedAction
      );

      protectedForm.appendChild(
        protectedToken
      );

      protectedForm.appendChild(
        protectedCode
      );

      document.body.appendChild(
        protectedForm
      );

      protectedForm.submit();

      return;
    }



    if (page === "seat") {

      languagePanel.style.display = "none";
      statusEl.style.display = "block";

      setStatus(
        "正在驗證員工身分並載入座位表...",
        ""
      );

      // 座位表模式不顯示一般員工驗證表單
      verifyForm.style.display = "none";

      // 將 LINE ID Token POST 至 Apps Script 後端驗證
      const seatForm = document.createElement("form");
      seatForm.method = "POST";
      seatForm.action =
        "https://script.google.com/macros/s/AKfycbwUY-3Cto9dvnFJsTEni5f2MC5ofsQ-xV3593-fgSfoux55AGkspFdnAmW7oef_HS7PEA/exec";

      const actionInput = document.createElement("input");
      actionInput.type = "hidden";
      actionInput.name = "action";
      actionInput.value = "getMidAutumnSeat";

      const tokenInput = document.createElement("input");
      tokenInput.type = "hidden";
      tokenInput.name = "idToken";
      tokenInput.value = idToken;

      seatForm.appendChild(actionInput);
      seatForm.appendChild(tokenInput);
      document.body.appendChild(seatForm);

      seatForm.submit();
      return;
    }

    // 一般員工身分驗證模式
    const profile = await liff.getProfile();

    idTokenInput.value = idToken;

    lineReady = true;
    lineProfileName =
      profile && profile.displayName
        ? profile.displayName
        : "";

    if(currentLanguage){

      setStatus(
        getVerifyText("lineReady") +
        (
          lineProfileName
            ? "｜" + lineProfileName
            : ""
        ),
        "success"
      );

      verifyButton.disabled = false;
      verifyButton.textContent =
        getVerifyText("confirm");
    }

  } catch (error) {

    console.error("LIFF ERROR", error);

    if(currentLanguage){

      setStatus(
        getVerifyText("liffFailed") +
        (
          error && error.message
            ? error.message
            : ""
        ),
        "error"
      );
    }

    verifyButton.disabled = true;

    if(currentLanguage){
      verifyButton.textContent =
        getVerifyText("unavailable");
    }
  }
}


/* =====================================================
   表單送出前檢查
===================================================== */

verifyForm.addEventListener(
  "submit",
  function (event) {

    const employeeId =
      employeeIdInput.value
        .trim()
        .toUpperCase();

    const employeeName =
      employeeNameInput.value
        .trim();


    /* -------------------------
       回寫整理後的資料
    -------------------------- */

    employeeIdInput.value =
      employeeId;

    employeeNameInput.value =
      employeeName;


    /* -------------------------
       基本檢查
    -------------------------- */

    if (
      !employeeId ||
      !employeeName ||
      !idTokenInput.value
    ) {

      event.preventDefault();


      setStatus(
        getVerifyText("incomplete"),
        "error"
      );


      return;

    }


    /* -------------------------
       防止重複點擊
    -------------------------- */

    verifyButton.disabled =
      true;

    verifyButton.textContent =
      getVerifyText("checking");


    setStatus(
      getVerifyText("checkingEmployee"),
      ""
    );


    /*
      注意：
      這裡「不使用 event.preventDefault()」

      因此瀏覽器會正常使用 POST
      將表單送往 Apps Script Web App。
    */

  }
);


/* =====================================================
   頁面載入
===================================================== */

window.addEventListener(
  "load",
  function(){

    const params =
      new URLSearchParams(
        window.location.search
      );

    const page =
      params.get("page") || "";

    // 特殊受保護頁面仍需立即驗證
    if(
      page === "seat" ||
      page === "activityLink"
    ){
      statusEl.style.display = "block";
      languagePanel.style.display = "none";

      loadLiffSdk_()
        .then(function(){
          return initializeLiff();
        })
        .catch(function(error){
          setStatus(
            "LINE 驗證元件載入失敗：" +
            (
              error && error.message
                ? error.message
                : ""
            ),
            "error"
          );
        });

      return;
    }

    // 一般員工綁定：
    // 先讓使用者選語言，再啟動 LINE 驗證
    languagePanel.style.display = "block";
    verifyForm.style.display = "none";
    statusEl.style.display = "none";
  }
);

</script>

</body>
</html>
